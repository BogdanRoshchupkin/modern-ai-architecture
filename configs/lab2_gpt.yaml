seed: 42

paths:
  train_data: data/processed/wikitext_packed.jsonl
  tokenizer: data/processed/common_crawl_bpe.json
  checkpoint_dir: checkpoints/lab2_vocab1000
  log_dir: logs/tensorboard

model:
  vocab_size: 1000
  max_seq_len: 512
  d_model: 256
  n_layers: 6
  n_heads: 4
  d_ff: 1024
  dropout: 0.05
  pad_token_id: 0

training:
  batch_size: 8
  num_workers: 0
  max_epochs: 20
  learning_rate: 0.0005
  weight_decay: 0.01
  warmup_steps: 300
  min_lr_ratio: 0.1
  gradient_clip_val: 1.0
  val_fraction: 0.1
  log_every_n_steps: 20
  accumulate_grad_batches: 1
  precision: 32-true
  accelerator: auto
  devices: 1

logging:
  experiment_name: lab2_gpt_vocab1000
  tensorboard_name: gpt_like_vocab1000
  clearml_enabled: false
  clearml_project: modern-ai-architecture

generation:
  max_new_tokens: 80
  temperature: 0.9
  top_k: 50
